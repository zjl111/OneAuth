app:
  secret_key: "change-me-in-production-please-use-strong-secret"
  environment: "development"
  host: "0.0.0.0"
  port: 8080
  # 数据库驱动: postgres | sqlite
  driver: "sqlite"

database:
  host: "localhost"
  port: 5432
  user: "sso"
  password: "sso"
  dbname: "sso_platform"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 10
  # SQLite 路径（driver=sqlite 时使用）
  sqlite_path: "./data/sso.db"

redis:
  enabled: false  # 设为 false 时使用内存存储（开发模式）
  addr: "localhost:6379"
  password: ""
  db: 0

oauth:
  issuer: "http://localhost:8080"
  access_token_ttl: 3600
  refresh_token_ttl: 604800   # 7 天；refresh 每次使用会 rotate，活跃用户自然续期
  auth_code_ttl: 300
  session_ttl: 28800          # 服务端会话有效期（秒），默认 8 小时；0 = 使用内置默认值
  keys_dir: "./keys"
  # 开发环境下前端 SPA 的地址（用于 302 跳转到登录/同意页）
  # 空字符串表示与 issuer 同域（生产 Nginx 反代模式）
  frontend_url: "http://localhost:5174"

cors:
  allowed_origins:
    - "http://localhost:5174"
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://localhost:8080"
  allow_credentials: true

monitor:
  enabled: true
  interval_seconds: 30
  default_timeout_ms: 10000
  default_degraded_ms: 2000
  retention_days: 30

status:
  public: true  # /api/status/* 是否公开访问

security:
  # 目录同步/批量导入新建账号的默认密码；留空则回退到随机密码（不可登录，需管理员重置）
  default_password: "OneAuth@2026"
