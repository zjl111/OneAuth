services:
  backend:
    image: oneauth/backend:v1.0.13
    environment:
      SSO_APP_DRIVER: "sqlite"
      SSO_APP_ENVIRONMENT: "production"
      SSO_APP_SECRET_KEY: ${SECRET_KEY}
      SSO_DATABASE_SQLITE_PATH: /app/data/sso.db
      SSO_REDIS_ENABLED: "false"
      SSO_OAUTH_ISSUER: ${SSO_ISSUER}
      SSO_OAUTH_FRONTEND_URL: ""
    volumes:
      - ./conf/config.yaml:/app/configs/config.yaml
      - ./data:/app/data
      - ./keys:/app/keys
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    image: oneauth/gateway:v1.0.13
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-80}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
